<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background with yellow outline (iPhone app style ~22% corner radius) -->
  <rect x="3" y="3" width="94" height="94" rx="22" ry="22" fill="#1a1a1a" stroke="#FFD700" stroke-width="3"/>
  <!-- Yellow 'S' in monospace font (same as notepad) -->
  <text x="50" y="70" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="60" font-weight="bold" fill="#FFD700" text-anchor="middle">S</text>
</svg>
